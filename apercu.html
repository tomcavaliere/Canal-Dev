<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Aperçu d'une page HTML déposée dans un projet (js/files.js). Chargée uniquement dans un cadre
       sandbox SANS allow-same-origin : la page affichée a une origine opaque et n'a accès ni au compte,
       ni aux données, ni au stockage de Canal Dev. Sa politique de contenu est donc large (styles et
       scripts de la page, polices et bibliothèques externes) ; celle de l'application reste stricte. -->
  <meta http-equiv="Content-Security-Policy" content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; base-uri *">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aperçu</title>
  <script src="js/apercu.js"></script>
</head>
<body></body>
</html>
